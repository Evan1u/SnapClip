<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <rect width="3840" height="2160" fill="#f5f5f7"/>
  <rect x="160" y="140" width="3520" height="1880" rx="48" fill="#ffffff" stroke="#d2d2d7" stroke-width="8"/>
  <text x="280" y="330" font-family="-apple-system, PingFang SC, Helvetica" font-size="112" font-weight="700" fill="#1d1d1f">SnapClip 4K OCR 性能测试</text>
  <text x="280" y="455" font-family="-apple-system, PingFang SC, Helvetica" font-size="54" fill="#6e6e73">固定样本 · 3840 × 2160 · Simplified Chinese + English</text>
  <g font-family="-apple-system, PingFang SC, Helvetica" font-size="62" fill="#1d1d1f">
    <text x="280" y="650">01  快捷键截图后，图片立即进入系统剪贴板。</text>
    <text x="280" y="750">02  The newest screenshot appears first in history.</text>
    <text x="280" y="850">03  历史最多保存三张，退出应用即清空。</text>
    <text x="280" y="950">04  OCR runs locally with Apple Vision.</text>
    <text x="280" y="1050">05  支持简体中文、繁體中文和 English。</text>
    <text x="280" y="1150">06  Preview reuses one lightweight window.</text>
    <text x="280" y="1250">07  空闲时不轮询，CPU 应接近零。</text>
    <text x="280" y="1350">08  Privacy first: no upload, no analytics.</text>
    <text x="280" y="1450">09  截图失败不会修改历史记录。</text>
    <text x="280" y="1550">10  Copy text, paste anywhere, keep moving.</text>
  </g>
  <g font-family="Menlo, monospace" font-size="46" fill="#424245">
    <text x="280" y="1740">0123456789  ABCDEFGHIJKLMNOPQRSTUVWXYZ</text>
    <text x="280" y="1825">abcdefghijklmnopqrstuvwxyz  !@#$%^&amp;*()_+-=[]{};:,.?</text>
  </g>
  <text x="3560" y="1940" text-anchor="end" font-family="-apple-system, PingFang SC, Helvetica" font-size="44" fill="#86868b">SnapClip Test Fixture v1</text>
</svg>
